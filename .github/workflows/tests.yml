name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline tests (no network, no keys)
        run: python -m unittest discover -s tests -v
      - name: Generated references and examples are current
        run: |
          python scripts/build_references.py --check
          python scripts/build_examples.py --check
          python scripts/build_walkthrough.py --check
